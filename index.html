<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Gate Scanner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#0b0f14;color:#fff;font:16px/1.3 system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#161c24}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#2b3644;color:#fff}
button.pri{background:#2563eb}
#banner{background:#b45309;padding:8px 12px;font-size:14px}
main{flex:1;position:relative;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:20% 15%;border:3px solid #ffffff88;border-radius:16px;pointer-events:none}
#startBox{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#0b0f14;padding:24px;text-align:center}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#ov.green{background:#16a34a}#ov.red{background:#dc2626}#ov.orange{background:#d97706}#ov.blue{background:#2563eb}#ov.grey{background:#4b5563}
#ov h1{font-size:34px;margin:0}#ov .roll{font-size:42px;font-weight:700;letter-spacing:2px}#ov .sub{font-size:18px}
#ov .acts{display:flex;gap:10px;margin-top:14px}#ov .acts button{background:#000a}
footer{padding:10px 12px;background:#161c24;display:grid;gap:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid #3a4656;background:#0b0f14;color:#fff;min-width:0;width:100%}
#panel{position:fixed;inset:0;background:#0b0f14;overflow:auto;padding:16px;z-index:5;display:grid;gap:12px;align-content:start}
#panel label{display:grid;gap:6px;font-size:14px;color:#9fb0c3}
#panel h2,#panel h3{margin:0}#recent{font:13px/1.5 ui-monospace,monospace;color:#cbd5e1}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:20px;z-index:9;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><b id="sAdm">0</b> in &middot; <span id="sList">0</span> loaded<span id="gateTag"></span></div>
    <button id="btnSet">Settings</button>
  </header>
  <div id="banner" hidden></div>
  <main>
    <video id="v" playsinline muted></video>
    <div class="frame"></div>
    <div id="startBox">
      <button class="pri" id="btnStart" style="font-size:20px;padding:18px 26px">Tap to start scanning</button>
      <p id="startMsg"></p>
    </div>
    <div id="ov" hidden>
      <h1 id="oT"></h1><div class="roll" id="oR"></div><div class="sub" id="oS"></div>
      <div class="acts" id="oA" hidden><button id="btnOver">Admit anyway (approved)</button><button id="btnDis">Dismiss</button></div>
    </div>
  </main>
  <footer>
    <div class="row"><input id="man" inputmode="numeric" maxlength="8" placeholder="Type roll number" autocomplete="off"><button class="pri" id="btnMan" style="flex:0 0 90px">Check</button></div>
    <button id="btnUndo">Undo last scan</button>
  </footer>
</div>

<div id="panel" hidden>
  <h2>Settings</h2>
  <label>Gate name (saved in the log)<input id="gate" placeholder="e.g. Gate A"></label>
  <label>Roll range for this phone (optional, leave empty for all)
    <div class="row"><input id="from" inputmode="numeric" maxlength="8" placeholder="from"><input id="to" inputmode="numeric" maxlength="8" placeholder="to"></div></label>
  <button class="pri" id="btnLoad">Load roll list (CSV)</button>
  <input type="file" id="file" accept=".csv,text/csv,text/plain" hidden>
  <div id="loadInfo"></div>
  <div class="row"><button id="btnClrLog">Reset entries</button><button id="btnWipe">Wipe all data</button></div>
  <button class="pri" id="btnClose">Close</button>
</div>
<div id="toast" hidden></div>

<script src="jsQR.js"></script>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full or blocked!')}}};
let list=new Set(store.get('gate.list',[])), log=store.get('gate.log',[]),
    cfg=store.get('gate.cfg',{gate:'',from:'',to:''}), admitted=new Set(), busy=false, hideT=null, lastRoll='', lastSeen=0, stream=null, actx=null, toastT=null;

const norm=r=>{const d=String(r).replace(/\D/g,'');return(!d||d.length>8)?null:d.padStart(8,'0')};
const loc=iso=>{const d=new Date(iso),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
const tm=iso=>new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function rebuild(){admitted=new Set(log.filter(e=>e.s==='REGISTERED'||e.s==='MANUAL').map(e=>e.r))}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2500)}

/* ---------- decision logic ---------- */
function inRange(r){const f=norm(cfg.from),t=norm(cfg.to);return !((f&&r<f)||(t&&r>t))}
function record(r,s){const e={r,t:new Date().toISOString(),s,g:cfg.gate||''};log.push(e);store.set('gate.log',log);return e}
function decide(r){
  if(!list.size)return show('grey','LOAD LIST FIRST','Open Settings and load the CSV',r);
  if(!inRange(r)){record(r,'WRONG_GATE');return show('blue','WRONG GATE','This roll belongs to another gate',r,true)}
  if(admitted.has(r)){const f=log.find(e=>e.r===r&&(e.s==='REGISTERED'||e.s==='MANUAL'));record(r,'DUPLICATE');return show('orange','DUPLICATE','Already entered at '+tm(f.t),r)}
  if(list.has(r)){record(r,'REGISTERED');admitted.add(r);return show('green','REGISTERED','',r)}
  record(r,'NOT_REGISTERED');show('red','NOT REGISTERED','Send to help desk',r,true)
}
function override(){const r=$('oR').textContent;record(r,'MANUAL');admitted.add(r);hide();upd();toast('Admitted manually: '+r)}

/* ---------- result screen ---------- */
function show(kind,title,sub,roll,act){
  busy=true;clearTimeout(hideT);
  const o=$('ov');o.className=kind;o.hidden=false;
  $('oT').textContent=title;$('oR').textContent=roll||'';$('oS').textContent=sub||'';$('oA').hidden=!act;
  if(!act)hideT=setTimeout(hide,2200);
  beep(kind);upd();
}
function hide(){clearTimeout(hideT);$('ov').hidden=true;busy=false}
$('ov').onclick=()=>{if($('oA').hidden)hide()};
$('btnOver').onclick=override;$('btnDis').onclick=hide;
function beep(kind){
  const pat={green:[[880,.12]],orange:[[440,.12],[440,.12]],red:[[220,.45]],blue:[[330,.2],[330,.2]],grey:[[300,.2]]}[kind]||[];
  if(navigator.vibrate)navigator.vibrate({green:60,orange:[80,60,80],red:300,blue:[100,50,100],grey:100}[kind]);
  if(!actx)return;let t=actx.currentTime;
  pat.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d+.08})
}

/* ---------- camera + decode ---------- */
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),vid=$('v');
async function start(){
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    vid.srcObject=stream;await vid.play();$('startBox').hidden=true;wake();tick();
  }catch(e){$('startMsg').textContent='Camera unavailable ('+(e.name||'error')+'). Allow camera permission, or use manual entry below.'}
}
function tick(){
  if(!stream)return;
  if(vid.readyState>=2&&vid.videoWidth){
    const sc=Math.min(1,960/Math.max(vid.videoWidth,vid.videoHeight));
    cv.width=Math.round(vid.videoWidth*sc);cv.height=Math.round(vid.videoHeight*sc);
    cx.drawImage(vid,0,0,cv.width,cv.height);
    const im=cx.getImageData(0,0,cv.width,cv.height),c=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});
    if(c&&c.data){
      const now=Date.now(),r=norm(c.data);
      if(busy){lastSeen=now}
      else if(r&&r===lastRoll&&now-lastSeen<1200){lastSeen=now} // same card still in view: ignore until it leaves the frame
      else{lastSeen=now;lastRoll=r||'';r?decide(r):show('grey','INVALID CODE','Not a roll number: '+String(c.data).slice(0,20),'')}
    }
  }
  setTimeout(tick,80);
}
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream)wake()});
$('btnStart').onclick=start;

/* ---------- manual entry / undo ---------- */
function manual(){const r=norm($('man').value);if(!r)return toast('Enter 1 to 8 digits');$('man').value='';lastRoll='';decide(r)}
$('btnMan').onclick=manual;$('man').onkeydown=e=>{if(e.key==='Enter')manual()};
$('btnUndo').onclick=()=>{const e=log.pop();if(!e)return toast('Nothing to undo');store.set('gate.log',log);rebuild();hide();upd();toast('Undid '+e.r+' ('+e.s+')')};

/* ---------- CSV load ---------- */
$('btnLoad').onclick=()=>$('file').click();
$('file').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  const rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/),out=new Set();let bad=0;
  rows.forEach((ln,i)=>{const c=ln.split(',')[0].replace(/["'\s]/g,'');if(!c)return;if(i===0&&/[a-z]/i.test(c))return;
    if(/^\d{1,8}$/.test(c))out.add(c.padStart(8,'0'));else bad++});
  ev.target.value='';
  if(!out.size)return toast('No valid roll numbers found in that file');
  if(list.size&&!confirm('Replace current list ('+list.size+') with new list ('+out.size+')?'))return;
  list=out;store.set('gate.list',[...list]);
  const a=[...list];$('loadInfo').textContent=list.size+' rolls loaded ('+bad+' rows skipped). First '+a[0]+', last '+a[a.length-1]+'. Compare this count with your Sheet.';
  upd();
};

/* ---------- settings panel ---------- */
function openPanel(){$('gate').value=cfg.gate;$('from').value=cfg.from;$('to').value=cfg.to;$('panel').hidden=false}
$('btnSet').onclick=openPanel;
$('btnClose').onclick=()=>{cfg={gate:$('gate').value.trim(),from:$('from').value.trim(),to:$('to').value.trim()};store.set('gate.cfg',cfg);$('panel').hidden=true;upd()};
$('btnClrLog').onclick=()=>{if(confirm('Reset all entries? Everyone will count as not yet entered.')){log=[];store.set('gate.log',log);rebuild();upd();$('panel').hidden=true}};
$('btnWipe').onclick=()=>{if(confirm('Wipe roll list and entries from this phone?')){['gate.list','gate.log'].forEach(k=>localStorage.removeItem(k));list=new Set();log=[];rebuild();upd();$('panel').hidden=true}};

/* ---------- status bar ---------- */
function upd(){
  $('sAdm').textContent=admitted.size;$('sList').textContent=list.size;$('gateTag').textContent=cfg.gate?' \u00b7 '+cfg.gate:'';
  const b=$('banner');let m='';
  if(!list.size)m='No roll list loaded. Open Settings and load the CSV.';
  b.textContent=m;b.hidden=!m;
}
rebuild();upd();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

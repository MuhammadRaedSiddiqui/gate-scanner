<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gate">
<title>Gate Scanner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#f4f6f8;color:#111827;font:16px/1.3 system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e7eb}
.logo{height:40px;width:auto}.hl{display:flex;align-items:center;gap:10px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#e5e7eb;color:#111827}
button.pri{background:#15803d;color:#fff}
#banner{background:#fef3c7;color:#92400e;padding:8px 12px;font-size:14px}
main{flex:1;position:relative;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover}
#btnTorch,#btnZoom{position:absolute;top:10px;z-index:2;background:#000b;color:#fff;padding:10px 14px}
#btnTorch{right:10px}#btnZoom{right:128px}
#btnTorch.on{background:#facc15;color:#111}
.frame{position:absolute;inset:12% 8%;border:3px solid #ffffff88;border-radius:16px;pointer-events:none}
#startBox{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#f4f6f8;color:#111827;padding:24px;text-align:center}
#startBox img{height:110px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:#fff}
#ov.green{background:#16a34a}#ov.red{background:#dc2626}#ov.orange{background:#d97706}#ov.blue{background:#2563eb}#ov.grey{background:#4b5563}
#ov h1{font-size:34px;margin:0}#ov .roll{font-size:42px;font-weight:700;letter-spacing:2px}#ov .sub{font-size:22px;line-height:1.5;white-space:pre-line}
#ov .acts{display:flex;gap:10px;margin-top:14px}#ov .acts button{background:#000a;color:#fff}
footer{padding:10px 12px;background:#fff;border-top:1px solid #e5e7eb;display:grid;gap:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#111827;min-width:0;width:100%}
#panel{position:fixed;inset:0;background:#f4f6f8;overflow:auto;padding:16px;z-index:5;display:grid;gap:12px;align-content:start}
#panel label{display:grid;gap:6px;font-size:14px;color:#475569}
#panel h2,#panel h3{margin:0}
select{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#111827;width:100%}
#loadInfo{white-space:pre-line;font-size:14px;color:#475569}
#viewer{position:fixed;inset:0;background:#f4f6f8;z-index:8;display:flex;flex-direction:column;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.vh{display:flex;justify-content:space-between;align-items:center}
#vl{flex:1;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:14px/1.7 ui-monospace,monospace;white-space:pre}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111827e6;color:#fff;padding:10px 16px;border-radius:20px;z-index:9;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><img class="logo" src="logo.png" alt="Logo"><div><b id="sAdm">0</b> in &middot; <span id="sList">0</span> loaded<span id="gateTag"></span></div></div>
    <button id="btnSet">Settings</button>
  </header>
  <div id="banner" hidden></div>
  <main>
    <video id="v" playsinline muted></video>
    <div class="frame"></div>
    <button id="btnTorch" hidden>Flash: OFF</button><button id="btnZoom" hidden>Zoom 1.5x</button>
    <div id="startBox">
      <img src="logo.png" alt="">
      <button class="pri" id="btnStart" style="font-size:20px;padding:18px 26px">Tap to start scanning</button>
      <p id="startMsg"></p>
    </div>
    <div id="ov" hidden>
      <h1 id="oT"></h1><div class="roll" id="oR"></div><div class="sub" id="oS"></div>
      <div class="acts" id="oA" hidden><button id="btnOver">Admit anyway (approved)</button><button id="btnDis">Dismiss</button></div>
    </div>
  </main>
  <footer>
    <div class="row"><input id="man" inputmode="numeric" maxlength="8" placeholder="Type roll number" autocomplete="off"><button class="pri" id="btnMan" style="flex:0 0 90px">Check</button></div>
  </footer>
</div>

<div id="panel" hidden>
  <h2>Settings</h2>
  <label>Gate name (shown in the top bar)<input id="gate" placeholder="e.g. Gate A"></label>
  <label>Roll range for this phone (optional, leave empty for all)
    <div class="row"><input id="from" inputmode="numeric" maxlength="8" placeholder="from"><input id="to" inputmode="numeric" maxlength="8" placeholder="to"></div></label>
  <div class="row"><button class="pri" id="btnLoad">Load CSV files</button><button id="btnAdd">Add more files</button></div>
  <input type="file" id="file" accept=".csv,text/csv,text/plain" multiple hidden>
  <label>Exam checked at this phone (pick one exam per phone)<select id="exam"></select></label>
  <div id="loadInfo"></div>
  <button id="btnView" hidden>View list</button>
  <div class="row"><button id="btnClrLog">Reset entries</button><button id="btnWipe">Wipe all data</button></div>
  <button class="pri" id="btnClose">Close</button>
</div>
<div id="viewer" hidden>
  <div class="vh"><b id="vc"></b><button id="vx">Close</button></div>
  <input id="vq" inputmode="numeric" placeholder="Search roll number" autocomplete="off">
  <div id="vl"></div>
</div>
<div id="toast" hidden></div>

<script src="jsQR.js"></script>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full or blocked!')}}};
function loadDb(){const v=store.get('gate.list',{});if(Array.isArray(v)){const o={};v.forEach(r=>o[r]=[['','',1]]);return o}return v}
const rm=(...ks)=>ks.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
rm('gate.log','gate.exp','gate.torch'); // one-time cleanup of old keys
function loadAdm(){const v=store.get('gate.adm',{});return(v&&typeof v==='object'&&!Array.isArray(v))?v:{}}
let db=loadDb(),
    cfg=store.get('gate.cfg',{gate:'',from:'',to:''}), admitted=loadAdm(), skipped=0, dupes=0, conflicts=0, srcs=store.get('gate.src',[]), busy=false, hideT=null, lastRoll='', lastSeen=0, stream=null, actx=null, toastT=null;

const norm=r=>{const d=String(r).replace(/\D/g,'');return(!d||d.length>8)?null:d.padStart(8,'0')};

const tm=iso=>new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const nrolls=()=>Object.keys(db).length, key=r=>r+'|'+(cfg.exam||'');

function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2500)}

/* ---------- decision logic ---------- */
function inRange(r){const f=norm(cfg.from),t=norm(cfg.to);return !((f&&r<f)||(t&&r>t))}
function admit(r){const k=key(r);if(!admitted[k]){admitted[k]=new Date().toISOString();store.set('gate.adm',admitted)}} // first entry time only
const fmt=v=>v.map(x=>'time: '+(x[1]||'-')+'\nexam: '+(x[0]||'-')).join('\n\n');
function decide(r){
  if(!nrolls())return show('grey','LOAD LIST FIRST','Open Settings and load the CSV',r);
  if(!inRange(r)){return show('blue','WRONG GATE','This roll belongs to another gate',r,true)}
  const e=db[r]||[],f=e.filter(v=>!cfg.exam||v[0]===cfg.exam),ok=f.filter(v=>v[2]);
  if(admitted[key(r)])return show('orange','DUPLICATE','Already entered at '+tm(admitted[key(r)])+(ok.length?'\n\n'+fmt(ok):''),r);
  if(ok.length){admit(r);return show('green','REGISTERED',fmt(ok),r)}

  if(f.length)return show('red','NOT ELIGIBLE','Listed as not eligible: '+f.map(v=>v[0]||'this exam').join(', '),r,true);
  const o=e.filter(v=>v[2]);
  if(o.length)return show('red','WRONG EXAM','Registered for:\n'+fmt(o),r,true);
  show('red','NOT REGISTERED','Send to help desk',r,true)
}
function override(){const r=$('oR').textContent;admit(r);hide();upd();toast('Admitted manually: '+r)}

/* ---------- result screen ---------- */
function show(kind,title,sub,roll,act){
  busy=true;clearTimeout(hideT);
  const o=$('ov');o.className=kind;o.hidden=false;
  $('oT').textContent=title;$('oR').textContent=roll||'';$('oS').textContent=sub||'';$('oA').hidden=!act;
  if(!act)hideT=setTimeout(hide,2200);
  beep(kind);upd();
}
function hide(){clearTimeout(hideT);$('ov').hidden=true;busy=false}
$('ov').onclick=()=>{if($('oA').hidden)hide()};
$('btnOver').onclick=override;$('btnDis').onclick=hide;
function beep(kind){
  const pat={green:[[880,.12]],orange:[[440,.12],[440,.12]],red:[[220,.45]],blue:[[330,.2],[330,.2]],grey:[[300,.2]]}[kind]||[];
  if(navigator.vibrate)navigator.vibrate({green:60,orange:[80,60,80],red:300,blue:[100,50,100],grey:100}[kind]);
  if(!actx)return;let t=actx.currentTime;
  pat.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d+.08})
}

/* ---------- camera + decode ---------- */
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),cv2=document.createElement('canvas'),cx2=cv2.getContext('2d',{willReadFrequently:true}),vid=$('v'),guide=document.querySelector('.frame');
let track=null,caps={},torchOn=false,zoomIdx=1,loopId=0,starting=false,detector=null,derr=0,bestStrat=-1,prefer=false,ladderN=0,cyc=0,lastDecode=0,objSince=0,lastHint=0;
const ZOOMS=[1,1.5,2];
// 1) native BarcodeDetector when the phone has it (jsQR ladder is the fallback)
(async()=>{try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null}})();
function stopCam(){loopId++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;caps={};torchOn=false;
  const b=$('btnTorch');b.hidden=true;b.textContent='Flash: OFF';b.classList.remove('on');$('btnZoom').hidden=true;vid.srcObject=null}
function camLost(){stopCam();$('startMsg').textContent='Camera stopped. Tap to restart.';$('startBox').hidden=false}
async function start(){
  if(starting)return;starting=true;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  stopCam();
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    stream=s;track=s.getVideoTracks()[0];vid.srcObject=s;await vid.play();
    const t=track;t.addEventListener('ended',()=>{if(track===t)camLost()});
    t.addEventListener('mute',()=>setTimeout(()=>{if(track===t&&(t.muted||t.readyState==='ended'))camLost()},1500));
    $('startBox').hidden=true;wake();lastDecode=Date.now();objSince=0;startLoop();initCam();setTimeout(()=>{if(track===t&&!caps.torch&&!caps.zoom)initCam()},800);
  }catch(e){stopCam();$('startMsg').textContent='Camera unavailable ('+(e.name||'error')+'). Allow camera permission, or use manual entry below.'}
  finally{starting=false}
}
// focus + zoom + torch are applied together as separate "advanced" sets so they never overwrite each other
async function applyCam(){if(!track)return;const adv=[];
  if(caps.focusMode&&caps.focusMode.includes('continuous'))adv.push({focusMode:'continuous'});
  if(caps.zoom)adv.push({zoom:Math.min(caps.zoom.max,Math.max(caps.zoom.min,ZOOMS[zoomIdx]))});
  if(caps.torch)adv.push({torch:torchOn});
  if(adv.length)await track.applyConstraints({advanced:adv})}
async function initCam(){if(!track)return;try{caps=track.getCapabilities?track.getCapabilities():{}}catch(e){caps={}}
  const z=store.get('gate.zoom',1);zoomIdx=(z>=0&&z<ZOOMS.length)?z:1;
  $('btnTorch').hidden=!caps.torch;$('btnZoom').hidden=!caps.zoom;$('btnZoom').textContent='Zoom '+ZOOMS[zoomIdx]+'x';
  try{await applyCam()}catch(e){}}
async function setTorch(on){const prev=torchOn;torchOn=on;try{await applyCam();$('btnTorch').textContent='Flash: '+(on?'ON':'OFF');$('btnTorch').classList.toggle('on',on)}catch(e){torchOn=prev;toast('Flash not available on this phone')}}
$('btnTorch').onclick=()=>setTorch(!torchOn);
$('btnZoom').onclick=async()=>{zoomIdx=(zoomIdx+1)%ZOOMS.length;store.set('gate.zoom',zoomIdx);$('btnZoom').textContent='Zoom '+ZOOMS[zoomIdx]+'x';try{await applyCam()}catch(e){}};
function startLoop(){const id=++loopId;(async function run(){if(id!==loopId||!stream)return;try{await tick(id)}catch(e){}setTimeout(run,80)})()}

// 2) preprocessing ladder for jsQR
const gray=d=>{const g=new Uint8ClampedArray(d.length>>2);for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;return g};
const rgba=g=>{const o=new Uint8ClampedArray(g.length*4);for(let i=0,j=0;i<g.length;i++,j+=4){o[j]=o[j+1]=o[j+2]=g[i];o[j+3]=255}return o};
const pct=(h,t)=>{let a=0;for(let i=0;i<256;i++){a+=h[i];if(a>=t)return i}return 255};
function stretch(g){const h=new Uint32Array(256);for(let i=0;i<g.length;i++)h[g[i]]++;
  const lo=pct(h,g.length*.02),hi=pct(h,g.length*.98),k=255/Math.max(1,hi-lo),o=new Uint8ClampedArray(g.length);
  for(let i=0;i<g.length;i++)o[i]=(g[i]-lo)*k;return o}
function boxMean(g,w,h,r){const W=w+1,I=new Float64Array(W*(h+1)),m=new Float32Array(w*h);
  for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+row}}
  for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);
    m[y*w+x]=(I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/((y1-y0)*(x1-x0))}}return m}
function adapt(g,w,h){const m=boxMean(g,w,h,12),o=new Uint8ClampedArray(g.length);for(let i=0;i<g.length;i++)o[i]=g[i]<m[i]*.93?0:255;return o} // 25x25 mean threshold
function sharp(g,w,h){const m=boxMean(g,w,h,2),o=new Uint8ClampedArray(g.length);for(let i=0;i<g.length;i++)o[i]=g[i]+1.6*(g[i]-m[i]);return o} // unsharp mask
// n: 0 raw, 1 contrast stretch, 2 adaptive threshold, 3 sharpen, 4 upscale + stretch
function prep(n,im,w,h){
  if(n===0)return[im.data,w,h];
  if(n===4){const f=Math.min(1.75,1400/Math.max(w,h));
    if(f>=1.1){cv2.width=Math.round(w*f);cv2.height=Math.round(h*f);cx2.imageSmoothingEnabled=true;cx2.imageSmoothingQuality='high';
      cx2.drawImage(cv,0,0,cv2.width,cv2.height);return[rgba(stretch(gray(cx2.getImageData(0,0,cv2.width,cv2.height).data))),cv2.width,cv2.height]}n=1}
  const g=gray(im.data);return[rgba(n===1?stretch(g):n===2?adapt(g,w,h):sharp(g,w,h)),w,h]}
function ladder(im,w,h){
  ladderN++;let n;
  if(ladderN%6===0)n=5;                                        // slower attemptBoth pass, every few ticks
  else if(prefer&&bestStrat>=0)n=bestStrat;                    // last winner goes first
  else if(bestStrat>=0&&ladderN%2===0)n=bestStrat;
  else n=cyc++%5;
  prefer=false;
  const base=n===5?(bestStrat>=0?bestStrat:1):n,p=prep(base,im,w,h),c=jsQR(p[0],p[1],p[2],{inversionAttempts:n===5?'attemptBoth':'dontInvert'});
  if(c&&c.data){bestStrat=base;prefer=true;return String(c.data).trim()}return null}

// 5) glare hint: something with contrast has been in the frame for 4 s but nothing decoded
function hintCheck(im){const now=Date.now(),d=im.data;let s=0,q=0,n=0;
  for(let i=1;i<d.length;i+=148){const v=d[i];s+=v;q+=v*v;n++}
  const sd=Math.sqrt(Math.max(0,q/n-(s/n)*(s/n)));
  if(sd<35)objSince=0;else if(!objSince)objSince=now;
  if(!busy&&objSince&&now-objSince>4000&&now-lastDecode>4000&&now-lastHint>15000){lastHint=now;objSince=now;toast('Tilt the card slightly to avoid glare, and keep it 15 to 25 cm away.',4000)}}
function onCode(q){const now=Date.now();lastDecode=now;objSince=0;
  if(busy){lastSeen=now}
  else if(q===lastRoll&&now-lastSeen<1200){lastSeen=now} // same card still in view: ignore until it leaves the frame
  else{lastSeen=now;lastRoll=q;/^\d{8}$/.test(q)?decide(q):show('grey','INVALID CODE','Not a roll number: '+q.slice(0,20),'')}}
async function tick(id){
  if(!$('panel').hidden||!$('viewer').hidden){lastSeen=Date.now();objSince=0;return} // paused while Settings / list viewer is open
  if(vid.readyState<2||!vid.videoWidth)return;
  const vw=vid.videoWidth,vh=vid.videoHeight,vr=vid.getBoundingClientRect(),fr=guide.getBoundingClientRect();
  if(!vr.width||!vr.height)return;
  // video is object-fit:cover: map the on-screen guide frame into video pixels
  const k=Math.max(vr.width/vw,vr.height/vh),ox=(vw*k-vr.width)/2,oy=(vh*k-vr.height)/2;
  const sx=Math.max(0,(fr.left-vr.left+ox)/k),sy=Math.max(0,(fr.top-vr.top+oy)/k);
  const sw=Math.min(vw-sx,fr.width/k),sh=Math.min(vh-sy,fr.height/k);
  if(sw<32||sh<32)return;
  const d=Math.min(1,1100/Math.max(sw,sh)),w=Math.round(sw*d),h=Math.round(sh*d);cv.width=w;cv.height=h;
  cx.drawImage(vid,sx,sy,sw,sh,0,0,w,h);
  let q=null;
  if(detector){try{const r=await detector.detect(cv);derr=0;if(r&&r.length&&r[0].rawValue)q=String(r[0].rawValue).trim()}catch(e){if(++derr>5)detector=null}}
  if(id!==loopId||!$('panel').hidden||!$('viewer').hidden)return;
  if(!q){const im=cx.getImageData(0,0,w,h);try{q=ladder(im,w,h)}catch(e){q=null}if(!q)hintCheck(im)}
  if(q)onCode(q);
}
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!stream)return;wake();
  if(!track||track.readyState==='ended'){camLost();return}
  const ct=vid.currentTime;setTimeout(()=>{if(stream&&!document.hidden&&vid.currentTime===ct)camLost()},1000)});
$('btnStart').onclick=start;

/* ---------- manual entry / undo ---------- */
function manual(){const r=norm($('man').value);if(!r)return toast('Enter 1 to 8 digits');$('man').value='';lastRoll='';decide(r)}
$('btnMan').onclick=manual;$('man').onkeydown=e=>{if(e.key==='Enter')manual()};

/* ---------- CSV load ---------- */
function parseCSV(t){const rows=[];let row=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}else if(ch==='\n'){row.push(c);rows.push(row);row=[];c=''}else if(ch!=='\r')c+=ch}
  if(c||row.length){row.push(c);rows.push(row)}return rows}
function parseSheet(text,fname){
  const rows=parseCSV(text),hi=rows.findIndex(r=>r.some(c=>/^\s*roll/i.test(c))),out=[];let bad=0;
  const title=rows.slice(0,Math.max(hi,0)).map(r=>r.join(' ')).join(' '),s=(fname+' '+title).toLowerCase();
  const exam=/oral|viva/.test(s)?'Oral Viva':/written/.test(s)?'Written Exam':fname.replace(/\.[^.]*$/,'');
  let tabs=[];
  if(hi>=0){const h=rows[hi],rc=h.map((c,i)=>/^\s*roll/i.test(c)?i:-1).filter(i=>i>=0);
    rc.forEach((j,k)=>{const end=k+1<rc.length?rc[k+1]:h.length,find=re=>{for(let i=j;i<end;i++)if(re.test(h[i]||''))return i;return -1};
      tabs.push({r:j,t:find(/time/i),e:find(/eligib/i)})})}
  else tabs=[{r:0,t:-1,e:-1}];
  rows.slice(hi+1).forEach(row=>tabs.forEach(tb=>{
    let c=(row[tb.r]||'').replace(/\s/g,'');if(!c)return;if(c.length>8)c=c.replace(/^0+/,'');
    if(!/^\d{1,8}$/.test(c)){if(hi>=0||/\d/.test(c))bad++;return}
    const ok=tb.e<0||/^(eligible|pass|passed|yes|ok|registered|selected)$/i.test((row[tb.e]||'').trim());
    out.push([c.padStart(8,'0'),exam,tb.t>=0?(row[tb.t]||'').trim():'',ok])}));
  return{rows:out,bad,exam}}
let loadMode='replace';
$('btnLoad').onclick=()=>{loadMode='replace';$('file').click()};
$('btnAdd').onclick=()=>{loadMode='add';$('file').click()};
$('file').onchange=async ev=>{
  const files=[...ev.target.files];if(!files.length)return;
  const add=loadMode==='add',nd=add?JSON.parse(JSON.stringify(db)):{},src=add?srcs.slice():[];let bad=0,dup=0,conf=0,tot=0;
  for(const f of files){
    const p=parseSheet(await f.text(),f.name);let n=0,x=0;
    p.rows.forEach(([r,ex,t,ok])=>{const a=nd[r]||(nd[r]=[]),m=a.find(v=>v[0]===ex);
      if(!m)a.push([ex,t,ok?1:0]);else{dup++;if(ok&&!m[2]){m[1]=t;m[2]=1}else if(ok&&m[2]&&t&&m[1]!==t)conf++}
      ok?n++:x++});
    bad+=p.bad;tot+=n+x;src.push({name:f.name,n,x,ex:p.exam})}
  ev.target.value='';
  if(!tot)return toast('No valid roll numbers found in the selected file(s)');
  if(!add&&nrolls()&&!confirm('Replace current list ('+nrolls()+') with '+Object.keys(nd).length+' rolls from '+files.length+' file(s)?'))return;
  db=nd;srcs=src;skipped=bad;dupes=dup;conflicts=conf;store.set('gate.list',db);store.set('gate.src',srcs);
  upd();toast(nrolls()+' rolls loaded');
};

/* ---------- settings panel ---------- */
function openPanel(){$('gate').value=cfg.gate;$('from').value=cfg.from;$('to').value=cfg.to;
  const ex=[...new Set(Object.values(db).flat().map(v=>v[0]).filter(Boolean))],sel=$('exam');if(cfg.exam&&!ex.includes(cfg.exam))ex.push(cfg.exam);
  sel.innerHTML='';sel.add(new Option('All exams',''));ex.forEach(x=>sel.add(new Option(x,x)));sel.value=cfg.exam||'';$('panel').hidden=false}
$('btnSet').onclick=openPanel;
$('btnClose').onclick=()=>{cfg={gate:$('gate').value.trim(),from:$('from').value.trim(),to:$('to').value.trim(),exam:$('exam').value};store.set('gate.cfg',cfg);$('panel').hidden=true;upd()};
$('btnClrLog').onclick=()=>{if(confirm('Reset all entries? Everyone will count as not yet entered.')){admitted={};rm('gate.adm');upd();$('panel').hidden=true}};
$('btnWipe').onclick=()=>{if(confirm('Wipe roll list and entries from this phone?')){rm('gate.list','gate.adm','gate.src');db={};admitted={};srcs=[];skipped=0;dupes=0;conflicts=0;upd();$('panel').hidden=true}};

/* ---------- list viewer ---------- */
function renderView(){const q=$('vq').value.replace(/\D/g,''),a=Object.keys(db).sort(),r=q?a.filter(x=>x.includes(q)):a;
  $('vc').textContent=q?r.length+' of '+a.length+' shown':a.length+' rolls';
  $('vl').textContent=r.map(k=>db[k].map(v=>k+'  '+(v[1]||'-')+'  '+(v[0]||'')+(v[2]?'':'  NOT ELIGIBLE')).join('\n')).join('\n')||'No match'}
$('btnView').onclick=()=>{$('vq').value='';renderView();$('viewer').hidden=false};
$('vx').onclick=()=>$('viewer').hidden=true;$('vq').oninput=renderView;

/* ---------- status bar ---------- */
function upd(){
  $('loadInfo').textContent=nrolls()?nrolls()+' rolls loaded'+(srcs.length?'\n'+srcs.map(x=>x.name+(x.ex?' ('+x.ex+')':'')+': '+x.n+' eligible'+(x.x?', '+x.x+' not eligible':'')).join('\n'):'')+((skipped||dupes||conflicts)?'\n'+(skipped?skipped+' rows skipped. ':'')+(dupes?dupes+' repeats merged. ':'')+(conflicts?conflicts+' repeats with different time slots (first kept).':''):''):'No list loaded';$('btnView').hidden=!nrolls();
  $('sAdm').textContent=Object.keys(admitted).filter(k=>k.endsWith('|'+(cfg.exam||''))).length;$('sList').textContent=nrolls();$('gateTag').textContent=(cfg.gate?' \u00b7 '+cfg.gate:'')+(cfg.exam?' \u00b7 '+cfg.exam:'');
  const b=$('banner');let m='';
  if(!nrolls())m='No roll list loaded. Open Settings and load the CSV.';
  b.textContent=m;b.hidden=!m;
}
upd();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
